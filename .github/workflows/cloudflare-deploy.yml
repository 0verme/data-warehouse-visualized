name: Cloudflare deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cloudflare-validation-pr-{0}', github.event.pull_request.number) || 'cloudflare-production' }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify built SEO and sitemap contract
        run: npm run test:english-seo-build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e:smoke -- --skip-build

      - name: Run English Foundation browser contract
        run: npm run test:e2e:english-foundation -- --skip-build

      - name: Run duplicate scheduler entry browser checks
        run: npm run test:e2e:duplicate-entry -- --skip-build

      - name: Run browser fragment regression
        run: npm run test:e2e:learn-anchor -- --skip-build

      - name: Run Knowledge Search browser checks
        run: npm run test:e2e:search -- --skip-build

      - name: Verify BASE_PATH build contract
        run: |
          BASE_PATH=/seo-base-path/ npm run build
          npm run test:english-seo-build -- --base-path /seo-base-path/
          BASE_PATH=/seo-base-path/ npm run test:e2e:english-foundation -- --skip-build

      - name: Restore production root build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: 0verme/ci-workflows/.github/actions/cloudflare-worker-deploy@v1
        with:
          working_directory: .
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
