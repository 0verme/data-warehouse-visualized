name: SCD Type 2 PostgreSQL example

on:
  pull_request:
    paths:
      - 'src/features/english-scd/sql/**'
      - 'src/pages/en/data-warehouse/scd-type-2/**'
      - 'tests/scd-type-2-postgres.mjs'
      - 'package.json'
      - '.github/workflows/scd-type-2-sql.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/english-scd/sql/**'
      - 'src/pages/en/data-warehouse/scd-type-2/**'
      - 'tests/scd-type-2-postgres.mjs'
      - 'package.json'
      - '.github/workflows/scd-type-2-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-example:
    name: Execute published SCD2 SQL on PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
      - name: Execute published SQL and regression scenarios
        env:
          SCD_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:scd-postgres
